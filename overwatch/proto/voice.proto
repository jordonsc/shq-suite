syntax = "proto3";

package voice;

service VoiceService {
  // Enable or disable an alarm
  rpc SetAlarm(SetAlarmRequest) returns (SetAlarmResponse);

  // Synthesise and play a text prompt
  rpc Verbalise(VerbaliseRequest) returns (VerbaliseResponse);

  // Play a single notification tone (no TTS)
  rpc PlayTone(PlayToneRequest) returns (PlayToneResponse);
}

message SetAlarmRequest {
  string alarm_id = 1;
  bool enabled = 2;
  optional float volume = 3;  // Volume level 0.0-1.0
}

message SetAlarmResponse {
  bool success = 1;
  string message = 2;
}

message VerbaliseRequest {
  string text = 1;
  optional string notification_tone_id = 2;
  optional string voice_id = 3;
  optional float volume = 4;  // Volume level 0.0-1.0
  optional bool await_playback = 5;  // if true, block until playback finishes (default false = fire-and-forget)
  optional float duck_alarm_factor = 6;  // if 0<f<1, scale ALL active alarm sinks by f for the duration of the clip (e.g. 0.5 = half), then restore (absent/0 = no ducking)
}

message VerbaliseResponse {
  bool success = 1;
  string message = 2;
}

message PlayToneRequest {
  string tone_id = 1;         // key from notification_tones config
  optional float volume = 2;  // Volume level 0.0-1.0
}

message PlayToneResponse {
  bool success = 1;
  string message = 2;
}
