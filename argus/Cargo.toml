[package]
name = "argus"
version = "0.3.0"
edition = "2021"
description = "Argus — AI-powered alarm assessment daemon (native x86_64, runs on atlas)"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# WebSocket client (HA event stream)
tokio-tungstenite = "0.21"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

# HTTP client (HA camera_proxy REST + Anthropic /v1/messages)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Vision payload encoding
base64 = "0.22"

# CLI
clap = { version = "4", features = ["derive"] }

# Timestamps (case ids, started_at/updated_at, journal)
chrono = { version = "0.4", features = ["serde"] }

# Errors
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config/home-dir resolution (~/.config/argus precedent, mirrors nyx)
directories = "5.0"

# Offsite case replication (Phase 2a): S3 mirror of the case dir. rustls TLS to
# match reqwest above (no native OpenSSL). Explicit static write-only creds — no
# aws-config / ambient credential chain.
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "rustls"] }
