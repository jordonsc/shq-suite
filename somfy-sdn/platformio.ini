; Somfy SDN controller — Unexpected Maker TinyC6 (ESP32-C6)
;
; Design twin of actron-sniffer. ESP32-C6 needs the pioarduino platform fork; the official
; platformio espressif32 platform still rejects the arduino framework on C6. If the platform
; URL 404s, bump the tag to the latest release at
; https://github.com/pioarduino/platform-espressif32/releases

[env:um_tinyc6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = um_tinyc6
framework = arduino

; Console is the native USB Serial/JTAG (single USB-C does flashing + console).
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
monitor_rts = 0
monitor_dtr = 0

lib_deps =
    links2004/WebSockets @ ^2.6.1
    bblanchon/ArduinoJson @ ^7.4.1

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1            ; C6 has only USB-Serial/JTAG (HWCDC), no USB-OTG
    -D CORE_DEBUG_LEVEL=0
    ; arduinoWebSockets does BLOCKING socket I/O bounded by this timeout (spin loops in
    ; WebSockets.cpp read/write). The 5000 ms default let one zombie client stall the main
    ; loop for tens of seconds per pass (somfy_sdn_06: 50 s worst), making pongs late so the
    ; reaper evicted the healthy HA client — the availability-flap feedback loop (ledger
    ; shq-suite-0038). 500 ms is still generous for a LAN peer and bounds a single library
    ; socket operation; the keepalive deadline itself is now 45 s (src/ws_liveness.h).
    -D WEBSOCKETS_TCP_TIMEOUT=500

; Wireless reflash once the device is in the wall: pio run -e um_tinyc6_ota -t upload
; (driven from a NON-WSL LAN host — WSL's NAT blocks the device's callback. Normally we use
; the HTTP-pull OTA path instead; see CLAUDE.md.)
[env:um_tinyc6_ota]
extends = env:um_tinyc6
upload_protocol = espota
upload_port = somfy-sdn.local

; Host-side test env for the pure-C++ protocol + device-table logic (no Arduino deps).
; Run with: pio test -e native
;
; Compile only the Arduino-free translation units; main.cpp / bus.cpp / ws_api.cpp /
; http_api.cpp / wifi_prov.cpp pull in Arduino headers that won't build on the host.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<sdn.cpp> +<errlog.cpp> +<devices.cpp> +<mono.cpp> +<fault.cpp> +<netwatch.cpp> +<txstats.cpp> +<tcpsnap.cpp> +<ws_liveness.cpp>
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -I src
