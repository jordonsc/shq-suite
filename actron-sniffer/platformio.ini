; Actron RS485 sniffer — Unexpected Maker TinyC6 (ESP32-C6)
;
; ESP32-C6 needs the pioarduino platform fork; the official platformio
; espressif32 platform still rejects the arduino framework on C6.
; If the platform URL 404s, bump the tag to the latest release at
; https://github.com/pioarduino/platform-espressif32/releases

[env:um_tinyc6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = um_tinyc6
framework = arduino

; Console is the native USB Serial/JTAG (single USB-C does flashing + console).
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
monitor_rts = 0
monitor_dtr = 0

lib_deps =
    links2004/WebSockets @ ^2.6.1
    bblanchon/ArduinoJson @ ^7.4.1

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1            ; C6 has only USB-Serial/JTAG (HWCDC), no USB-OTG
    -D CORE_DEBUG_LEVEL=0

; Wireless reflash once the device is in the wall: pio run -e um_tinyc6_ota -t upload
[env:um_tinyc6_ota]
extends = env:um_tinyc6
upload_protocol = espota
upload_port = actron-sniffer.local   ; mDNS name, or the device IP

; Host-side test env for the MITM bridge logic + state decoder (pure C++, no Arduino deps).
; Run with: pio test -e native
[env:native]
platform = native
test_framework = unity
test_build_src = yes
; Compile bridge.cpp + state.cpp only; main.cpp + ws_api.cpp pull in Arduino headers that
; won't build on the host.
build_src_filter = +<bridge.cpp> +<state.cpp>
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -I src

